<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jafran Originals</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-dark">
  <div class="safe-area">
    <header class="top-bar">
      <span class="logo-small">JAFRAN ORIGINALS</span>
    </header>

    <section class="hero">
      <img src="assets/posters/home-top.jpg" alt="Featured banner" />
      <div class="hero-overlay">
        <h2 class="hero-title">My Little Princess</h2>
        <p class="hero-desc">A special trailer made only for you.</p>
        <button class="play-btn" onclick="openPlayer()">Play Trailer</button>
      </div>
    </section>

    <section class="section">
      <h3 class="section-title">Made For You</h3>
      <div class="row">
        <button class="poster" onclick="openPlayer()">
          <img src="assets/posters/movie1.jpg" alt="For My Queen" />
        </button>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
